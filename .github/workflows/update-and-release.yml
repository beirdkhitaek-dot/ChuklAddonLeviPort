name: update-and-release
on:
  push:
    paths: ['chukl-levi-update.zip']   # upload the zip to the repo root -> it unpacks itself
    tags: ['v*']                        # push a tag like v0.1.0 -> build + GitHub Release
  workflow_dispatch:                    # Actions tab -> Run workflow -> build only

permissions:
  contents: write

jobs:
  unpack:
    if: github.ref_type == 'branch' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unpack update zip over the repo
        if: ${{ hashFiles('chukl-levi-update.zip') != '' }}
        run: |
          unzip -oq chukl-levi-update.zip -d /tmp/upd
          SRC=/tmp/upd
          [ -d /tmp/upd/chukl-levi ] && SRC=/tmp/upd/chukl-levi
          # .github is skipped: the default token is not allowed to change workflow files
          rsync -a --exclude '.github' "$SRC"/ ./
          git rm -q chukl-levi-update.zip
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Apply chukl-levi-update.zip"
          git push

  build:
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: nttld/setup-ndk@v1
        id: ndk
        with:
          ndk-version: r28c
      - name: Configure
        run: >
          cmake -S . -B build
          -DCMAKE_TOOLCHAIN_FILE=${{ steps.ndk.outputs.ndk-path }}/build/cmake/android.toolchain.cmake
          -DANDROID_ABI=arm64-v8a -DANDROID_PLATFORM=android-26
          -DCMAKE_BUILD_TYPE=Release
      - name: Build
        run: cmake --build build -j
      - name: Package .levipack
        run: bash scripts/package.sh "$(find build -name libchukl_levi.so | head -n1)"
      - uses: actions/upload-artifact@v4
        with:
          name: chukl_levi.levipack
          path: dist/arm64-v8a/chukl_levi.levipack
      - name: Publish GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: dist/arm64-v8a/chukl_levi.levipack
          generate_release_notes: true
